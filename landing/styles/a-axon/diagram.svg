<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" fill="none" role="img" aria-label="Patent diagram: flat sheet becomes creased folds, then speech; all arrows point right">
  <g font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#6e645c">
    <!-- 1 flat plane -->
    <g transform="translate(40,90)">
      <polygon points="20,80 140,40 240,70 120,120" fill="#f8f4ea" stroke="#1a1513" stroke-width="2"/>
      <line x1="70" y1="62" x2="170" y2="88" stroke="#d6ccbc" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="95" y1="52" x2="195" y2="78" stroke="#d6ccbc" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="20" y="150">FLAT PLANE</text>
    </g>
    <!-- arrow 1 → -->
    <g transform="translate(300,130)" stroke="#1a1513" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="0" x2="48" y2="0"/>
      <polyline points="36,-10 50,0 36,10" fill="none"/>
    </g>
    <!-- 2 creased folds, active in vermilion -->
    <g transform="translate(370,70)">
      <!-- accordion panels in isometric-ish stack, all reading left→right -->
      <polygon points="10,100 50,40 90,100" fill="#f8f4ea" stroke="#1a1513" stroke-width="2"/>
      <polygon points="70,100 110,30 150,100" fill="#f8f4ea" stroke="#1a1513" stroke-width="2"/>
      <polygon points="130,100 170,25 210,100" fill="#c34838" stroke="#1a1513" stroke-width="2"/>
      <polygon points="190,100 230,40 270,100" fill="#f8f4ea" stroke="#1a1513" stroke-width="2"/>
      <line x1="0" y1="110" x2="280" y2="110" stroke="#d6ccbc" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="10" y="150">CREASED FOLDS</text>
    </g>
    <!-- arrow 2 → -->
    <g transform="translate(680,130)" stroke="#1a1513" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="0" x2="48" y2="0"/>
      <polyline points="36,-10 50,0 36,10" fill="none"/>
    </g>
    <!-- 3 speech waves, opening to the right -->
    <g transform="translate(750,70)" stroke="#c34838" fill="none" stroke-linecap="round">
      <path d="M20,30 A30,30 0 0 1 20,90" stroke-width="3"/>
      <path d="M45,15 A50,50 0 0 1 45,105" stroke-width="2.5" opacity=".75"/>
      <path d="M70,0 A70,70 0 0 1 70,120" stroke-width="2" opacity=".45"/>
      <text x="10" y="150" fill="#6e645c" stroke="none">SPEECH</text>
    </g>
  </g>
</svg>
