services:
  tts-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Browser origin when hitting the API directly (proxy makes this optional)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin /api proxy — browser never needs the backend host
        NEXT_PUBLIC_API_URL: ""
        # Compose-network route: Next server → tts-api service
        API_PROXY_URL: http://tts-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - tts-api
