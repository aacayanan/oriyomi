<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-fold-desk.webp</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f1e6}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2816px">
  <div class="r-crane-mark region chrome" data-region="crane-mark"><!-- small vermilion crane line mark left of the wordmark --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- serif Text Reader wordmark, text only --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-top-nav region text" data-region="top-nav"><!-- small-caps letterspaced nav: READ FOLDS GUIDE QUIZ in sumi --><p style="line-height:1.05;margin:0">top-nav</p></div>
  <div class="r-play-button region control" data-region="play-button"><!-- vermilion rounded PLAY button with one gold dot and white play triangle: rebuild the control's chrome from the crop (comp-spec.mjs --crop play-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-fold-progress-label region text" data-region="fold-progress-label"><!-- small-caps ink-fade label FOLD 02 OF 04 --><p style="line-height:1.05;margin:0">fold-progress-label</p></div>
  <div class="r-progress-dots region control" data-region="progress-dots"><!-- row of four dots, second solid gold, others ink-fade outline: rebuild the control's chrome from the crop (comp-spec.mjs --crop progress-dots); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-fold-card-crease region plate" data-region="fold-card-crease"><img src="../../../assets/plates/fold-card-crease.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-fold-card-text region text" data-region="fold-card-text"><!-- large vermilion serif number 02, title Glycolysis in serif, caption 6:38 --><p style="line-height:1.05;margin:0">fold-card-text</p></div>
  <div class="r-voice-row region control" data-region="voice-row"><!-- outline row with speaker glyph, small-caps VOICE, value Emma: rebuild the control's chrome from the crop (comp-spec.mjs --crop voice-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-tempo-row region control" data-region="tempo-row"><!-- outline row with clock glyph, small-caps TEMPO, value 1.0x: rebuild the control's chrome from the crop (comp-spec.mjs --crop tempo-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-timestamp-strip region text" data-region="timestamp-strip"><!-- monospace timestamps 00:42:180 and 00:47:900 in ink-fade --><p style="line-height:1.05;margin:0">timestamp-strip</p></div>
  <div class="r-para-1 region text" data-region="para-1"><!-- first body paragraph Glycolysis is the first step in cellular respiration... ATP and NADH; vermilion check tick sits just left of its first line --><p style="line-height:1.05;margin:0">para-1</p></div>
  <div class="r-para-2 region text" data-region="para-2"><!-- second paragraph This process does not require oxygen... all living cells --><p style="line-height:1.05;margin:0">para-2</p></div>
  <div class="r-active-sentence region text" data-region="active-sentence"><!-- active sentence Glycolysis takes place in the cytoplasm with a gold dot in its left margin and a vermilion crease underline --><p style="line-height:1.05;margin:0">active-sentence</p></div>
  <div class="r-para-3 region text" data-region="para-3"><!-- paragraph The overall reaction is: C6H12O6 + 2 NAD+ ... + 2 H2O --><p style="line-height:1.05;margin:0">para-3</p></div>
  <div class="r-para-4 region text" data-region="para-4"><!-- paragraph Glycolysis consists of two phases... energy-payoff phase --><p style="line-height:1.05;margin:0">para-4</p></div>
  <div class="r-para-5 region text" data-region="para-5"><!-- paragraph During the energy-investment phase, two ATP molecules are used to activate glucose --><p style="line-height:1.05;margin:0">para-5</p></div>
  <div class="r-para-6 region text" data-region="para-6"><!-- paragraph In the energy-payoff phase, four ATP molecules are produced by substrate-level phosphorylation --><p style="line-height:1.05;margin:0">para-6</p></div>
  <div class="r-sheet-corner-marks region chrome" data-region="sheet-corner-marks"><!-- small sumi play and previous triangle marks at the sheet's bottom corners --></div>
  <figure class="r-crane-sheet region plate" data-region="crane-sheet"><img src="../../../assets/plates/crane-sheet.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-current-fold-panel region chrome" data-region="current-fold-panel"><!-- hairline-bordered panel bottom-right holding the current-fold readout --></div>
  <div class="r-current-fold-label region text" data-region="current-fold-label"><!-- small-caps ink-fade label CURRENT FOLD --><p style="line-height:1.05;margin:0">current-fold-label</p></div>
  <div class="r-current-fold-number region text" data-region="current-fold-number"><!-- large vermilion serif number 02 --><p style="line-height:1.05;margin:0">current-fold-number</p></div>
  <div class="r-current-fold-title region text" data-region="current-fold-title"><!-- serif title Glycolysis under the number --><p style="line-height:1.05;margin:0">current-fold-title</p></div>
  <div class="r-washi-ground region texture" data-region="washi-ground" style="background-image:url('../../../assets/plates/washi-ground.png');background-repeat:repeat"></div>
</main>
</body>
</html>
